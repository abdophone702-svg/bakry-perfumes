<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بكري | BAKRY — Eau de Parfum</title>
<meta name="description" content="كتالوج عطور بكري BAKRY — عطور فاخرة بحجم 50 مل. اطلب مباشرة عبر واتساب.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { bk: { 900:'#0b2231', 800:'#0f3044', 700:'#154058', 500:'#2d6a8a', 100:'#e6eef3', 50:'#f4f8fa' } },
      fontFamily: { ar:['Cairo','sans-serif'], en:['"Cormorant Garamond"','serif'] }
    } }
  }
</script>
<style>
  body { font-family:'Cairo',sans-serif; background:#f4f8fa; color:#0b2231; }
  .brand { font-family:'Cormorant Garamond',serif; letter-spacing:.35em; }
  .card { transition:transform .25s ease, box-shadow .25s ease; }
  .card:hover { transform:translateY(-4px); box-shadow:0 18px 40px -18px rgba(11,34,49,.45); }
  .card img { transition:transform .5s ease; }
  .card:hover img { transform:scale(1.04); }
  :focus-visible { outline:2px solid #2d6a8a; outline-offset:3px; }
  @media (prefers-reduced-motion:reduce){ .card,.card img{transition:none} .card:hover{transform:none} }
</style>
</head>
<body>

<!-- ===== HERO ===== -->
<header class="bg-bk-900 text-white text-center px-6 py-16 sm:py-24">
  <img src="images/bakry-2.jpg" alt="" class="hidden">
  <h1 class="brand text-5xl sm:text-7xl font-semibold" dir="ltr">BAKRY</h1>
  <p class="mt-2 text-bk-100/70 font-en text-lg tracking-widest" dir="ltr">EAU DE PARFUM</p>
  <div class="mx-auto my-6 h-px w-16 bg-bk-500"></div>
  <p class="max-w-xl mx-auto text-bk-100 leading-loose">
    عطور مختارة بعناية، بتركيزات عالية وثبات يدوم طول اليوم، في زجاجات أنيقة بحجم 50 مل.
  </p>
  <a href="#products" class="inline-block mt-8 rounded-full bg-white text-bk-900 font-semibold px-8 py-3 hover:bg-bk-100 transition">تصفّح العطور</a>
</header>

<!-- ===== SEARCH ===== -->
<section id="products" class="max-w-6xl mx-auto px-4 pt-12">
  <input id="search" type="search" placeholder="ابحث عن عطر…" aria-label="ابحث عن عطر"
    class="w-full sm:w-96 mx-auto block rounded-full border border-bk-700/20 bg-white px-6 py-3 text-center shadow-sm focus:border-bk-500">
</section>

<!-- ===== GRID ===== -->
<main class="max-w-6xl mx-auto px-4 py-10">
  <div id="grid" class="grid grid-cols-1 min-[480px]:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
  <p id="empty" class="hidden text-center text-bk-700 py-16">لا يوجد عطر بهذا الاسم.</p>
</main>

<footer class="bg-bk-900 text-bk-100/80 text-center py-10 px-4 text-sm">
  <p class="brand text-2xl text-white" dir="ltr">BAKRY</p>
  <p class="mt-3">للطلب والاستفسار تواصل معنا عبر واتساب</p>
  <p class="mt-6 text-bk-100/40">© <span id="year"></span> BAKRY</p>
</footer>

<script>
/* =====================================================================
   ⚙️  الإعدادات — عدّل من هنا فقط
   ===================================================================== */
const SETTINGS = {
  whatsappNumber: "201000000000",   // رقمك بصيغة دولية بدون + أو 00 (مثال مصر: 20 + الرقم بدون الصفر)
  currency: "ج.م",
  size: "50 مل"
};

/* الصور: ضع صورك في فولدر images/ واكتب اسم الملف في الحقل image
   لو سبت image فاضي هتظهر صورة افتراضية.
   price: اكتب السعر كرقم. لو 0 هيظهر "اسأل عن السعر". */
const PRODUCTS = [
  { name:"انفيكتوس إكسير", en:"Invictus Elixir — Paco Rabanne", notes:"انتعاشة حارة على قاعدة خشبية عنبرية قوية", price:0, image:"images/bakry-1.jpg" },
  { name:"مارشميلو", en:"Marshmallow", notes:"حلوى ناعمة بفانيليا وبودرة ومسك دافئ", price:0, image:"images/bakry-2.jpg" },
  { name:"ليتون", en:"Layton — Parfums de Marly", notes:"تفاح وخزامى مع فانيليا وخشب، أنيق ومميز", price:0, image:"images/bakry-3.jpg" },
  { name:"عود مداوي", en:"Oud Mudawi", notes:"عود دافئ وغني بلمسة عنبر وبخور", price:0, image:"images/bakry-4.jpg" },
  { name:"بلو دو شانيل", en:"Bleu de Chanel", notes:"حمضيات منعشة مع خشب وعنبر، كلاسيكي رسمي", price:0, image:"images/bakry-1.jpg" },
  { name:"خمرة", en:"Khamrah — Lattafa", notes:"قرفة وتمر وفانيليا، حلو دافئ للشتاء", price:0, image:"images/bakry-2.jpg" },
  { name:"يارا كاندي", en:"Yara Candy — Lattafa", notes:"فواكه حلوة وفانيليا ومسك، خفيف وأنثوي", price:0, image:"images/bakry-3.jpg" },
  { name:"ألكسندريا 2", en:"Alexandria II — Xerjoff", notes:"عود وخشب أرز مع لمسة ورد، فخم وثابت", price:0, image:"images/bakry-4.jpg" },
  { name:"تباكو فانيليا", en:"Tobacco Vanille — Tom Ford", notes:"تبغ وفانيليا وتوابل، دافئ وعميق", price:0, image:"images/bakry-1.jpg" },
  { name:"عود كلمات", en:"Kalemat Oud — Arabian Oud", notes:"عود وعنبر وورد، شرقي كلاسيكي", price:0, image:"images/bakry-2.jpg" },
  { name:"فيرساتشي إيروس", en:"Versace Eros", notes:"نعناع وتفاح أخضر مع تونكا وفانيليا", price:0, image:"images/bakry-3.jpg" },
  { name:"بربري هير", en:"Burberry Her", notes:"توت وفواكه حمراء مع مسك، مرح وجذاب", price:0, image:"images/bakry-4.jpg" },
  { name:"لومال لو بارفان", en:"Le Male Le Parfum — Jean Paul Gaultier", notes:"هيل ولافندر وفانيليا، حسّي وثابت", price:0, image:"images/bakry-1.jpg" },
  { name:"لومال إكسير", en:"Le Male Elixir — Jean Paul Gaultier", notes:"لافندر ونعناع وعسل وتونكا، حلو ودافئ", price:0, image:"images/bakry-2.jpg" },
  { name:"بكارات روج 540", en:"Baccarat Rouge 540 — MFK", notes:"زعفران وياسمين وعنبر، فوّاح ولامع", price:0, image:"images/bakry-3.jpg" },
  { name:"ديور سوفاج", en:"Dior Sauvage", notes:"برغموت وفلفل وعنبر، منعش وقوي", price:0, image:"images/bakry-4.jpg" },
  { name:"واحة العطور", en:"Wahat", notes:"تركيبة شرقية منعشة بروح الواحة", price:0, image:"images/bakry-1.jpg" },
  { name:"عود بوكيه", en:"Oud Bouquet — Lancôme", notes:"عود مع باقة ورد، ناعم وفاخر", price:0, image:"images/bakry-2.jpg" },
  { name:"لاكوست وايت", en:"Lacoste Eau de Blanc", notes:"حمضيات وخشب نظيف، انتعاش يومي", price:0, image:"images/bakry-3.jpg" },
  { name:"ألتهاير", en:"Althair — Parfums de Marly", notes:"هيل وقرفة وفانيليا وخشب، حلو راقي", price:0, image:"images/bakry-4.jpg" }
];
/* ===================== نهاية الإعدادات ===================== */

const fallbackImg = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='#e6eef3'/><circle cx='150' cy='80' r='38' fill='#0b2231'/><rect x='108' y='112' width='84' height='128' rx='16' fill='#f0e9a8' stroke='#0b2231' stroke-width='4'/><rect x='122' y='150' width='56' height='56' fill='#0f3044'/></svg>`);

const fmt = n => n > 0 ? `${n.toLocaleString("ar-EG")} ${SETTINGS.currency}` : "اسأل عن السعر";

function waLink(p) {
  const priceTxt = p.price > 0 ? ` بسعر ${p.price} ${SETTINGS.currency}` : "";
  const msg = `مرحباً، أرجو طلب عطر ${p.name} (${p.en}) الحجم ${SETTINGS.size}${priceTxt}`;
  return `https://wa.me/${SETTINGS.whatsappNumber}?text=${encodeURIComponent(msg)}`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(list) {
  const grid = document.getElementById("grid");
  grid.innerHTML = list.map(p => `
    <article class="card flex flex-col overflow-hidden rounded-2xl bg-white shadow-md">
      <div class="aspect-square overflow-hidden bg-bk-100">
        <img src="${esc(p.image || '')}" alt="عطر ${esc(p.name)}" loading="lazy"
             class="h-full w-full object-cover" onerror="this.onerror=null;this.src='${fallbackImg}'">
      </div>
      <div class="flex flex-1 flex-col p-5">
        <h2 class="text-xl font-bold">${esc(p.name)}</h2>
        <p class="font-en text-base text-bk-500" dir="ltr" style="text-align:right">${esc(p.en)}</p>
        <p class="mt-2 text-sm text-bk-700/80 leading-relaxed flex-1">${esc(p.notes)}</p>
        <div class="mt-4 flex items-center justify-between text-sm">
          <span class="rounded-full bg-bk-100 px-3 py-1 text-bk-800">${SETTINGS.size}</span>
          <span class="font-bold text-bk-800">${fmt(p.price)}</span>
        </div>
        <a href="${waLink(p)}" target="_blank" rel="noopener"
           class="mt-4 block rounded-xl bg-bk-800 py-3 text-center font-semibold text-white transition hover:bg-bk-500">
          اطلب الآن عبر واتساب
        </a>
      </div>
    </article>`).join("");
  document.getElementById("empty").classList.toggle("hidden", list.length > 0);
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(PRODUCTS.filter(p => (p.name + " " + p.en).toLowerCase().includes(q)));
});

document.getElementById("year").textContent = new Date().getFullYear();
render(PRODUCTS);
</script>
</body>
</html>
